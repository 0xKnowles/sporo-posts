  now.x += (want.x - now.x) * 0.08; now.y += (want.y - now.y) * 0.08;
  frame.style.transform = `rotateY(${now.x * 9}deg) rotateX(${-now.y * 9}deg)`;
  bg.style.transform = `scale(1.08) translate(${-now.x * 1.6}%, ${-now.y * 1.6}%)`;
  glare.style.setProperty("--gx", 50 + now.x * 40 + "%"); glare.style.setProperty("--gy", 40 + now.y * 40 + "%");
  if (ready) { gl.uniform2f(uTilt, now.x, now.y); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }
  requestAnimationFrame(tick);
}
show(0); requestAnimationFrame(tick);
</script>
</body></html>
