#night{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(60,80,150,.55),rgba(20,28,70,.9) 80%);mix-blend-mode:multiply}
#halo{position:absolute;margin-top:-6vmin;width:80vmin;aspect-ratio:1;border-radius:6%;background:radial-gradient(closest-side,rgba(255,232,180,.55),rgba(255,180,100,.2) 62%,transparent);filter:blur(30px)}
#frame{position:relative;margin-top:-6vmin;width:62vmin;aspect-ratio:1;background:#fff;padding:3.4%;box-sizing:border-box;transform-style:preserve-3d;
 box-shadow:0 0 0 2px #fff,0 0 60px 14px rgba(255,236,190,.5),0 0 180px 50px rgba(255,190,110,.22)}
#gl{display:block;width:100%;height:100%;background:#222}
#glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.55),transparent 45%)}
#name{position:absolute;left:5.5vmin;bottom:7.6vmin;font-weight:bold;font-size:3vmin;letter-spacing:.2em}
#sub{position:absolute;left:5.5vmin;bottom:4.6vmin;color:var(--warm);font:1.45vmin "DejaVu Sans Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}
#seal{position:absolute;right:4vmin;bottom:3vmin;width:14vmin;height:14vmin}
#seal .ring{transform-origin:75px 75px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#hint{position:absolute;top:3vmin;left:0;right:0;text-align:center;color:var(--warm);font:1.5vmin "DejaVu Sans Mono",monospace;letter-spacing:.14em;opacity:.7;transition:opacity 1s}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:0}6%{opacity:1}22%{opacity:.85}100%{opacity:0}}
#frame.flashed #gl{animation:burn 2.4s ease-out}
@keyframes burn{0%{filter:brightness(2.6) contrast(.6)}100%{filter:none}}
#pick{position:absolute;top:6vmin;left:0;right:0;display:flex;justify-content:center;gap:10px}
#pick button{font:1.5vmin "DejaVu Sans Mono",monospace;background:transparent;color:var(--warm);border:1px solid rgba(232,217,184,.5);padding:4px 10px;border-radius:20px;cursor:pointer}
#pick button[aria-pressed=true]{background:var(--warm);color:#1a1408}
