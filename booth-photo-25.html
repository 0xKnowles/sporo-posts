const cv = document.getElementById("gl"), gl = cv.getContext("webgl", { antialias: false, preserveDrawingBuffer: false });
const vs = "attribute vec2 p; varying vec2 uv; void main(){ uv = p * 0.5 + 0.5; uv.y = 1.0 - uv.y; gl_Position = vec4(p, 0.0, 1.0); }";
const fs = `precision mediump float; varying vec2 uv; uniform sampler2D img, dep; uniform vec2 tilt;
void main(){
  vec2 c = (uv - 0.5) * 0.9 + 0.5, p = c;               // a little margin so the edges never show
  for (int i = 0; i < 10; i++) { float h = texture2D(dep, p).r; p = c - tilt * (h - 0.28) * 0.075; }
  gl_FragColor = texture2D(img, clamp(p, 0.0, 1.0));

async function show(k) {

  document.getElementById("sub").textContent = ph.title + " · " + ph.when;
  document.getElementById("no").textContent = "No. " + String(ph.n).padStart(3, "0");

}
if (PHOTOS.length > 1) PHOTOS.forEach((ph, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = "No. " + ph.n; b.onclick = () => show(i); document.getElementById("pick").append(b); });
