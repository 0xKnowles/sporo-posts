const cv = document.getElementById("gl"), gl = cv.getContext("webgl", { antialias: false, preserveDrawingBuffer: false });

const fs = `precision mediump float; varying vec2 uv; uniform sampler2D img, dep; uniform vec2 tilt;

async function show(k) {
